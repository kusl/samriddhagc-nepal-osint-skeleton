name: CI

on:
  push:
  pull_request:

jobs:
  ui-rework-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce UI rework boundaries
        run: ./scripts/ci/verify-ui-rework-boundaries.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend
        run: python -m compileall backend-v5/app backend-v5/tests

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Analyst API contract smoke
        run: npm run contract:analyst-api
      - name: Build
        run: npm run build
