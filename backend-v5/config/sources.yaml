- name: Official Nepal Sources
  query: (from:ECNOfficial OR from:NepaliArmyHQ OR from:BIPADPortal) -is:retweet
  category: official
  priority: 1
  max_results: 10
  poll_interval_mins: 720
- name: Nepal Breaking News
  query: (Nepal) (breaking OR emergency OR urgent) -is:retweet
  category: news
  priority: 2
  max_results: 10
  poll_interval_mins: 720
